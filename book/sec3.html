<div class="intro">1968 年深秋，我上山下乡来到崇明，在码头第一次见到芦苇。农场十年，有艰苦的劳动，也有意外的收获——外调汤恩伯的副官、养猪场的青料、赤膊电视的安装、盛夏拜访于漪老师、1977年高考与女友一起挑灯备考。</div>

<script>
(function(){
var GO={"p":"p19.html","n":"p20.html","t":function(){return "toc.html"}};
function goToc(){
  try{
    var m=document.querySelector('meta[name="sec"]');
    if(m&&m.content) sessionStorage.setItem("bjhx_open_sec",m.content);
    else sessionStorage.removeItem("bjhx_open_sec");
  }catch(e){}
  location.href=GO.t();
}
document.addEventListener("click",function(e){
  var t=e.target;
  if(t.closest&&t.closest("a,button"))return;
  var w=window.innerWidth,h=window.innerHeight,x=e.clientX,y=e.clientY;
  if(y>h*0.72){
    if(x>w*0.62&&GO.n){location.href=GO.n;return;}
    if(x<w*0.38&&GO.p){location.href=GO.p;return;}
  }
  if(x>w*0.30&&x<w*0.70&&y>h*0.28&&y<h*0.72){goToc();}
});
var L=document.querySelectorAll("a[data-toc]");
for(var i=0;i<L.length;i++)(function(a){a.addEventListener("click",function(ev){ev.preventDefault();goToc();});})(L[i]);
})();
</script>

<!--nav-boost-->
<script>
/* 底部导航：整块热区 + 触摸即时响应（防止手机端点偏、点快而"没反应"） */
(function(){
  var nav=document.querySelector('.nav');
  if(!nav)return;
  var as=nav.getElementsByTagName('a');
  for(var i=0;i<as.length;i++){(function(a){
    var sx=0,sy=0,st=0;
    a.addEventListener('touchstart',function(e){
      var t=e.touches[0];sx=t.clientX;sy=t.clientY;st=+new Date();
    },{passive:true});
    a.addEventListener('touchend',function(e){
      var t=e.changedTouches[0];
      if(!t)return;
      if(Math.abs(t.clientX-sx)>14||Math.abs(t.clientY-sy)>14)return;
      if(+new Date()-st>900)return;
      var h=a.getAttribute('href');
      if(!h)return;
      e.preventDefault();
      location.href=h;
    },{passive:false});
  })(as[i]);}
})();
</script>
