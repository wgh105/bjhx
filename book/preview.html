<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>预览</title>
<style>
html,body{margin:0;padding:0;background:#f5efe2}
iframe{width:375px;height:812px;border:0;display:block;margin:0;background:#f5efe2}
</style></head>
<body>
<iframe id="f"></iframe>
<script>
var q = new URLSearchParams(location.search);
var f = document.getElementById('f');
f.src = q.get('p') || 'p01.html';
f.onload = function () {
  var w = f.contentWindow;
  var sel = q.get('sel');
  if (sel) {
    var el = f.contentDocument.querySelector(sel);
    if (el) {
      var top = el.getBoundingClientRect().top + w.scrollY - parseInt(q.get('off') || '300', 10);
      w.scrollTo(0, Math.max(0, top));
      return;
    }
  }
  w.scrollTo(0, parseInt(q.get('y') || '0', 10));
};
</script></body></html>
